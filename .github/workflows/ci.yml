name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python build_crosswalk.py --source mappings.yaml --check
      - run: python -m unittest test_readme_span.py
      - run: python -m unittest test_build_crosswalk
      - run: python -m unittest discover -s tests
